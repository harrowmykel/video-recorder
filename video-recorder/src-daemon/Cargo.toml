[package]
name = "recorder-daemon"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
warp = "0.3"
futures-util = "0.3"
uuid = { version = "1", features = ["v4", "serde"] }

