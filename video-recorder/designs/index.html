<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UI Design Concepts Gallery — Screen & Camera Studio Recorder</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background-color: #09090b;
      color: #f4f4f5;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- Top Switcher Bar -->
  <header class="border-b border-zinc-800 bg-zinc-950/90 backdrop-blur-xl sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-6 py-4 flex flex-wrap items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl bg-rose-500/15 border border-rose-500/30 flex items-center justify-center text-rose-400">
          <i data-lucide="layers" class="w-5 h-5"></i>
        </div>
        <div>
          <h1 class="text-sm font-bold text-white tracking-tight">Screen & Camera Recorder — UI Design Prototypes</h1>
          <p class="text-xs text-zinc-400">Each file contains all 6 widgets built with standalone HTML + Tailwind CSS</p>
        </div>
      </div>

      <!-- Interactive Switcher Buttons -->
      <div class="flex flex-wrap items-center gap-2">
        <button onclick="selectDesign('01-obsidian-raycast.html', this)"
                class="design-tab px-3.5 py-2 rounded-xl text-xs font-semibold bg-rose-500 text-white shadow-sm transition flex items-center gap-2">
          <span class="font-mono opacity-80">01</span>
          <span>Obsidian Precision (Raycast / Linear)</span>
        </button>
        <button onclick="selectDesign('02-macos-frosted-spatial.html', this)"
                class="design-tab px-3.5 py-2 rounded-xl text-xs font-semibold bg-zinc-900 hover:bg-zinc-800 text-zinc-300 border border-zinc-800 transition flex items-center gap-2">
          <span class="font-mono opacity-60">02</span>
          <span>Spatial Frosted Glass (VisionOS / CleanShot)</span>
        </button>
        <button onclick="selectDesign('03-graphite-davinci-pro.html', this)"
                class="design-tab px-3.5 py-2 rounded-xl text-xs font-semibold bg-zinc-900 hover:bg-zinc-800 text-zinc-300 border border-zinc-800 transition flex items-center gap-2">
          <span class="font-mono opacity-60">03</span>
          <span>Broadcast Graphite Pro (DaVinci / TE)</span>
        </button>
        <button onclick="selectDesign('04-nordic-minimal-light-dark.html', this)"
                class="design-tab px-3.5 py-2 rounded-xl text-xs font-semibold bg-zinc-900 hover:bg-zinc-800 text-zinc-300 border border-zinc-800 transition flex items-center gap-2">
          <span class="font-mono opacity-60">04</span>
          <span>Nordic Alabaster & Ink (Light + Dark)</span>
        </button>
      </div>

      <a id="openDirectLink" href="01-obsidian-raycast.html" target="_blank"
         class="px-3.5 py-2 rounded-xl bg-zinc-800 hover:bg-zinc-700 text-xs font-medium text-zinc-200 flex items-center gap-1.5 transition">
        <span>Open Full Tab</span>
        <i data-lucide="external-link" class="w-3.5 h-3.5"></i>
      </a>
    </div>
  </header>

  <!-- Live Embedded Preview Frame -->
  <iframe id="previewFrame"
          src="01-obsidian-raycast.html"
          class="flex-1 w-full border-0 min-h-[calc(100vh-73px)] bg-zinc-950"
          title="Design Prototype Preview"></iframe>

  <script>
    lucide.createIcons();

    function selectDesign(filename, btn) {
      document.getElementById('previewFrame').src = filename;
      document.getElementById('openDirectLink').href = filename;

      document.querySelectorAll('.design-tab').forEach(el => {
        el.className = 'design-tab px-3.5 py-2 rounded-xl text-xs font-semibold bg-zinc-900 hover:bg-zinc-800 text-zinc-300 border border-zinc-800 transition flex items-center gap-2';
      });
      btn.className = 'design-tab px-3.5 py-2 rounded-xl text-xs font-semibold bg-rose-500 text-white shadow-sm transition flex items-center gap-2';
    }
  </script>
</body>
</html>
